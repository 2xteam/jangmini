allowBuilds:
  '@tsparticles/engine': true
  sharp: true
# pnpm 10+ 부터 이 설정의 집이 package.json 의 "pnpm" 필드가 아니라 이 파일이다.
# 여기에 없으면 pnpm 12 는 빌드 스크립트를 차단하고 ERR_PNPM_IGNORED_BUILDS 로 멈춘다.
#
# sharp              : Next.js 이미지 최적화. 네이티브 바이너리를 받아야 한다
# @tsparticles/engine: 원본 랜딩의 파티클 효과. 개인화 과정에서 안 쓰게 되면 지운다
